name: 🚀 Release

on:
    release:
        types: [ published ]

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    fedora:
        name: 📦 Build Fedora 44 RPM assets
        runs-on: ubuntu-latest
        container:
            image: fedora:44

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            RPM_RELEASE: "1"

        steps:
            -   name: ⚙️ Install build dependencies
                run: |
                    set -Eeuo pipefail
                    dnf -y \
                        --setopt=install_weak_deps=False \
                        --setopt=tsflags=nodocs \
                        install \
                        cpio \
                        gcc \
                        git \
                        glib2-devel \
                        gtk4-devel \
                        ibus-devel \
                        meson \
                        ninja-build \
                        pkgconf-pkg-config \
                        rpm-build \
                        tar \
                        xz

            -   name: 👀 Checkout
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.release.tag_name }}
                    fetch-depth: 0

            -   name: ⚙️ Trust checked-out workspace
                run: |
                    set -Eeuo pipefail
                    git config --global --add safe.directory "${GITHUB_WORKSPACE}"

            -   name: ⚙️ Validate release version
                run: |
                    set -Eeuo pipefail

                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ "${RPM_RELEASE}" =~ ^[0-9]+$ ]]
                    [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$(git rev-parse HEAD)" ]]

                    {
                        echo "VERSION=${RELEASE_TAG}"
                        echo "SC_VERSION=${RELEASE_TAG}"
                        echo "SOURCE_ARCHIVE=build/meson-dist/silent-compose-${RELEASE_TAG}.tar.xz"
                        echo "BINARY_ASSET=silent-compose.fc44.rpm"
                    } >> "${GITHUB_ENV}"

            -   name: 🔨 Build and test
                run: |
                    set -Eeuo pipefail

                    meson setup build --wipe
                    meson compile -C build
                    meson test -C build --print-errorlogs

                    MESON_VERSION="$(
                        meson introspect build --projectinfo |
                            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
                    )"

                    [[ "${MESON_VERSION}" == "${VERSION}" ]]
                    [[ "$(build/src/silent-compose-ibus --version)" == "Silent Compose ${VERSION}" ]]

            -   name: 🔨 Warning-as-error build and test
                run: |
                    set -Eeuo pipefail

                    meson setup build-review --wipe -Dwarning_level=3 -Dwerror=true
                    meson compile -C build-review
                    meson test -C build-review --print-errorlogs

            -   name: 🔨 Build source archive
                run: |
                    set -Eeuo pipefail

                    meson dist -C build --formats=xztar
                    [[ -f "${SOURCE_ARCHIVE}" ]]

                    if tar -tf "${SOURCE_ARCHIVE}" | grep -qx "silent-compose-${VERSION}/VERSION"; then
                        echo "VERSION file must not be packaged; release versions come from Git tags." >&2
                        exit 1
                    fi

            -   name: 🔨 Build Fedora RPMs
                run: |
                    set -Eeuo pipefail

                    RPM_TOPDIR="$(rpm --eval '%{_topdir}')"
                    [[ -n "${RPM_TOPDIR}" && "${RPM_TOPDIR}" != "%{_topdir}" ]]

                    mkdir -p \
                        "${RPM_TOPDIR}/BUILD" \
                        "${RPM_TOPDIR}/BUILDROOT" \
                        "${RPM_TOPDIR}/RPMS" \
                        "${RPM_TOPDIR}/SOURCES" \
                        "${RPM_TOPDIR}/SPECS" \
                        "${RPM_TOPDIR}/SRPMS"

                    mkdir -p build/packaging
                    sed \
                        -e "s/@VERSION@/${VERSION}/g" \
                        -e "s/@RPM_RELEASE@/${RPM_RELEASE}/g" \
                        -e "s/@RPM_CHANGELOG_DATE@/$(LC_ALL=C date -u '+%a %b %d %Y')/g" \
                        packaging/fedora/silent-compose.spec.in > build/packaging/silent-compose.spec

                    cp -- "${SOURCE_ARCHIVE}" "${RPM_TOPDIR}/SOURCES/"
                    rpmbuild -ba build/packaging/silent-compose.spec

                    mapfile -t BINARY_RPMS < <(
                        find "${RPM_TOPDIR}/RPMS" \
                            -type f \
                            -name "silent-compose-${VERSION}-${RPM_RELEASE}.fc44.*.rpm" \
                            ! -name "*debug*" \
                            -print
                    )
                    mapfile -t SOURCE_RPMS < <(
                        find "${RPM_TOPDIR}/SRPMS" \
                            -type f \
                            -name "silent-compose-${VERSION}-${RPM_RELEASE}.fc44.src.rpm" \
                            -print
                    )

                    [[ "${#BINARY_RPMS[@]}" == "1" ]]
                    [[ "${#SOURCE_RPMS[@]}" == "1" ]]

                    {
                        echo "BINARY_RPM=${BINARY_RPMS[0]}"
                        echo "SOURCE_RPM=${SOURCE_RPMS[0]}"
                    } >> "${GITHUB_ENV}"

            -   name: ⚙️ Verify release artifacts
                run: |
                    set -Eeuo pipefail

                    [[ "$(rpm -qp --qf '%{VERSION}' "${BINARY_RPM}")" == "${VERSION}" ]]
                    [[ "$(rpm -qp --qf '%{RELEASE}' "${BINARY_RPM}")" == "${RPM_RELEASE}.fc44" ]]
                    [[ "$(rpm -qp --qf '%{VERSION}' "${SOURCE_RPM}")" == "${VERSION}" ]]
                    [[ "$(rpm -qp --qf '%{RELEASE}' "${SOURCE_RPM}")" == "${RPM_RELEASE}.fc44" ]]

                    rm -rf release-assets release-inspect
                    mkdir -p \
                        release-assets \
                        release-inspect/binary-rpm \
                        release-inspect/source-rpm \
                        release-inspect/source-archive

                    rpm -qpi "${BINARY_RPM}" | tee release-assets/rpm-info.txt
                    rpm -qlp "${BINARY_RPM}" | tee release-assets/rpm-files.txt
                    rpm -qpR "${BINARY_RPM}" | tee release-assets/rpm-requires.txt
                    rpm -qpi "${SOURCE_RPM}" | tee release-assets/srpm-info.txt

                    cp -- "${BINARY_RPM}" "release-assets/${BINARY_ASSET}"
                    cp -- "${SOURCE_RPM}" release-assets/
                    cp -- "${SOURCE_ARCHIVE}" release-assets/

                    tar -xf "${SOURCE_ARCHIVE}" -C release-inspect/source-archive
                    (
                        cd release-inspect/binary-rpm
                        rpm2cpio "${BINARY_RPM}" | cpio -id --quiet
                    )
                    (
                        cd release-inspect/source-rpm
                        rpm2cpio "${SOURCE_RPM}" | cpio -id --quiet
                        tar -xf "silent-compose-${VERSION}.tar.xz"
                    )

                    HOME_PATH_PATTERN="/""home/"
                    X11_NAME="x11"
                    WRAPPER_PATTERN="run-as-${X11_NAME}"
                    OZONE_PATTERN="ozone-platform=${X11_NAME}"

                    ! grep -Rns \
                        -e "${HOME_PATH_PATTERN}" \
                        -e "${WRAPPER_PATTERN}" \
                        -e "${OZONE_PATTERN}" \
                        release-assets \
                        release-inspect

            -   name: 🚀 Upload build artifact
                uses: actions/upload-artifact@v4
                with:
                    name: silent-compose-fedora-assets
                    path: release-assets/
                    if-no-files-found: error

    debian:
        name: 📦 Build generic and Debian assets
        runs-on: ubuntu-latest
        container:
            image: debian:12

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            DEB_RELEASE: "1"

        steps:
            -   name: ⚙️ Install build dependencies
                run: |
                    set -Eeuo pipefail

                    apt-get update
                    apt-get install -y --no-install-recommends \
                        ca-certificates \
                        coreutils \
                        dpkg-dev \
                        file \
                        findutils \
                        gcc \
                        git \
                        libglib2.0-dev \
                        libgtk-4-dev \
                        libibus-1.0-dev \
                        ninja-build \
                        pkg-config \
                        python3-pip \
                        tar

                    pip3 install --break-system-packages "meson>=1.2.0"

            -   name: 👀 Checkout
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.release.tag_name }}
                    fetch-depth: 0

            -   name: ⚙️ Trust checked-out workspace
                run: |
                    set -Eeuo pipefail
                    git config --global --add safe.directory "${GITHUB_WORKSPACE}"

            -   name: ⚙️ Validate release version
                run: |
                    set -Eeuo pipefail

                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ "${DEB_RELEASE}" =~ ^[0-9]+$ ]]
                    [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$(git rev-parse HEAD)" ]]

                    {
                        echo "VERSION=${RELEASE_TAG}"
                        echo "SC_VERSION=${RELEASE_TAG}"
                        echo "PACKAGE_NAME=silent-compose"
                        echo "RUN_ASSET=silent-compose.run"
                        echo "DEB_ASSET=silent-compose.deb"
                    } >> "${GITHUB_ENV}"

            -   name: 🔨 Build and test
                run: |
                    set -Eeuo pipefail

                    meson setup build --buildtype=release
                    meson compile -C build
                    meson test -C build --print-errorlogs

                    MESON_VERSION="$(
                        meson introspect build --projectinfo |
                            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
                    )"

                    [[ "${MESON_VERSION}" == "${VERSION}" ]]
                    [[ "$(build/src/silent-compose-ibus --version)" == "Silent Compose ${VERSION}" ]]

            -   name: 🔨 Warning-as-error build and test
                run: |
                    set -Eeuo pipefail

                    meson setup build-review \
                        --buildtype=release \
                        -Dwarning_level=3 \
                        -Dwerror=true
                    meson compile -C build-review
                    meson test -C build-review --print-errorlogs

            -   name: 🔨 Stage install tree
                run: |
                    set -Eeuo pipefail

                    rm -rf package-root
                    DESTDIR="${PWD}/package-root" meson install -C build

                    MODULE_PATH="$(
                        find package-root \
                            -path '*/gtk-4.0/immodules/libsilent-compose.so' \
                            -print -quit
                    )"

                    [[ -n "${MODULE_PATH}" ]]
                    [[ -f "package-root/usr/libexec/silent-compose-ibus" ]]
                    [[ -f "package-root/usr/share/ibus/component/org.freedesktop.IBus.SilentCompose.xml" ]]

                    echo "MODULE_PATH=${MODULE_PATH}" >> "${GITHUB_ENV}"

            -   name: 🔨 Build runfile
                run: |
                    set -Eeuo pipefail

                    DIST_DIR="${PWD}/dist"
                    WORK_DIR="$(mktemp -d)"
                    PAYLOAD_DIR="${WORK_DIR}/${PACKAGE_NAME}-${VERSION}"
                    PAYLOAD_ARCHIVE="${DIST_DIR}/${PACKAGE_NAME}-${VERSION}.payload.tar.gz"

                    rm -rf "${DIST_DIR}"
                    mkdir -p "${DIST_DIR}" "${PAYLOAD_DIR}/gtk4" "${PAYLOAD_DIR}/usr"

                    install -D -m 0755 \
                        package-root/usr/libexec/silent-compose-ibus \
                        "${PAYLOAD_DIR}/usr/libexec/silent-compose-ibus"
                    install -D -m 0644 \
                        package-root/usr/share/ibus/component/org.freedesktop.IBus.SilentCompose.xml \
                        "${PAYLOAD_DIR}/usr/share/ibus/component/org.freedesktop.IBus.SilentCompose.xml"
                    install -m 0755 "${MODULE_PATH}" "${PAYLOAD_DIR}/gtk4/libsilent-compose.so"

                    install -m 0755 packaging/run/install.sh "${PAYLOAD_DIR}/install.sh"

                    {
                        printf 'Silent Compose %s\n\n' "${VERSION}"
                        printf 'Install:\n'
                        printf '  sudo ./install.sh\n\n'
                        printf 'Show the detected GTK 4 IM module directory:\n'
                        printf '  ./install.sh --print-immodules-dir\n\n'
                        printf 'Uninstall:\n'
                        printf '  sudo ./install.sh --uninstall\n\n'
                        printf 'Built on Debian 12 for x86_64. Requires glibc 2.36 or newer,\n'
                        printf 'GTK 4.2 or newer, and IBus 1.5 or newer.\n'
                    } > "${PAYLOAD_DIR}/README.install"

                    tar -C "${WORK_DIR}" -czf "${PAYLOAD_ARCHIVE}" "${PACKAGE_NAME}-${VERSION}"
                    cp packaging/run/self-extract-header.sh "${DIST_DIR}/${RUN_ASSET}"
                    cat "${PAYLOAD_ARCHIVE}" >> "${DIST_DIR}/${RUN_ASSET}"
                    chmod 0755 "${DIST_DIR}/${RUN_ASSET}"

            -   name: 🔨 Build Debian package
                run: |
                    set -Eeuo pipefail

                    DEB_ROOT="${PWD}/build/deb-root"
                    rm -rf "${DEB_ROOT}"
                    mkdir -p "${DEB_ROOT}/DEBIAN"

                    cp -a package-root/. "${DEB_ROOT}/"
                    install -m 0755 packaging/debian/postinst "${DEB_ROOT}/DEBIAN/postinst"
                    install -m 0755 packaging/debian/postrm "${DEB_ROOT}/DEBIAN/postrm"

                    INSTALLED_SIZE="$(du -sk "${DEB_ROOT}" | cut -f1)"
                    sed \
                        -e "s/@VERSION@/${VERSION}/g" \
                        -e "s/@DEB_RELEASE@/${DEB_RELEASE}/g" \
                        -e "s/@INSTALLED_SIZE@/${INSTALLED_SIZE}/g" \
                        packaging/debian/control.in > "${DEB_ROOT}/DEBIAN/control"

                    dpkg-deb --build --root-owner-group "${DEB_ROOT}" "dist/${DEB_ASSET}"

            -   name: ⚙️ Verify Debian and generic assets
                run: |
                    set -Eeuo pipefail

                    mkdir -p release-assets

                    [[ -f "dist/${RUN_ASSET}" ]]
                    [[ -f "dist/${DEB_ASSET}" ]]

                    "dist/${RUN_ASSET}" --help > /dev/null
                    "dist/${RUN_ASSET}" --print-immodules-dir |
                        grep -qx '/usr/lib/x86_64-linux-gnu/gtk-4.0/immodules'

                    tar -tzf "dist/${PACKAGE_NAME}-${VERSION}.payload.tar.gz" |
                        tee release-assets/run-files.txt
                    grep -qx "${PACKAGE_NAME}-${VERSION}/gtk4/libsilent-compose.so" \
                        release-assets/run-files.txt
                    grep -qx "${PACKAGE_NAME}-${VERSION}/usr/libexec/silent-compose-ibus" \
                        release-assets/run-files.txt

                    dpkg-deb --field "dist/${DEB_ASSET}" Version |
                        grep -qx "${VERSION}-${DEB_RELEASE}"
                    dpkg-deb --contents "dist/${DEB_ASSET}" |
                        tee release-assets/deb-files.txt
                    dpkg-deb --info "dist/${DEB_ASSET}" |
                        tee release-assets/deb-info.txt

                    grep -q 'gtk-4.0/immodules/libsilent-compose.so' release-assets/deb-files.txt
                    grep -q 'usr/libexec/silent-compose-ibus' release-assets/deb-files.txt
                    grep -q 'ibus/component/org.freedesktop.IBus.SilentCompose.xml' \
                        release-assets/deb-files.txt

                    HOME_PATH_PATTERN="/""home/"
                    X11_NAME="x11"
                    WRAPPER_PATTERN="run-as-${X11_NAME}"
                    OZONE_PATTERN="ozone-platform=${X11_NAME}"

                    ! grep -Rns \
                        -e "${HOME_PATH_PATTERN}" \
                        -e "${WRAPPER_PATTERN}" \
                        -e "${OZONE_PATTERN}" \
                        release-assets

                    cp -- "dist/${RUN_ASSET}" release-assets/
                    cp -- "dist/${DEB_ASSET}" release-assets/

            -   name: 🚀 Upload Debian release assets
                uses: actions/upload-artifact@v4
                with:
                    name: silent-compose-debian-assets
                    path: release-assets/
                    if-no-files-found: error

    upload:
        name: 🚀 Upload GitHub release assets
        runs-on: ubuntu-latest
        needs: [ debian, fedora ]

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            GH_TOKEN: ${{ github.token }}

        steps:
            -   name: ⚙️ Validate release tag
                run: |
                    set -Eeuo pipefail
                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

            -   name: ⚙️ Download build artifacts
                uses: actions/download-artifact@v4
                with:
                    path: release-assets
                    merge-multiple: true

            -   name: ⚙️ Generate checksums
                run: |
                    set -Eeuo pipefail

                    find release-assets -maxdepth 1 -type f \
                        \( -name "*.run" -o -name "*.tar.xz" -o -name "*.deb" -o -name "*.rpm" \) \
                        -printf '%f\n' |
                        sort |
                        while IFS= read -r file; do
                            (cd release-assets && sha256sum "${file}")
                        done > release-assets/SHA256SUMS

                    cat release-assets/SHA256SUMS

            -   name: 🚀 Upload release assets
                run: |
                    set -Eeuo pipefail

                    gh release upload "${RELEASE_TAG}" \
                        release-assets/*.run \
                        release-assets/*.deb \
                        release-assets/*.rpm \
                        release-assets/*.tar.xz \
                        release-assets/SHA256SUMS \
                        --repo "${GITHUB_REPOSITORY}" \
                        --clobber

    draft-on-failure:
        name: 🧹 Return release to draft on failure
        runs-on: ubuntu-latest
        needs: [ fedora, debian, upload ]
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            GH_TOKEN: ${{ github.token }}

        steps:
            -   name: 🧹 Unpublish the incomplete release
                run: |
                    set -Eeuo pipefail

                    echo "::warning title=Release returned to draft::${RELEASE_TAG} did not build cleanly and was unpublished."

                    gh release edit "${RELEASE_TAG}" \
                        --draft \
                        --repo "${GITHUB_REPOSITORY}"

    copr:
        name: 🚀 Publish COPR build
        runs-on: ubuntu-latest
        needs: [ fedora, upload ]
        container:
            image: fedora:44

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            RPM_RELEASE: "1"
            COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
            COPR_PROJECT: ${{ vars.COPR_PROJECT }}

        steps:
            -   name: ⚙️ Validate COPR configuration
                run: |
                    set -Eeuo pipefail

                    if [[ -z "${COPR_CONFIG}" ]]; then
                        echo "::error title=Missing COPR_CONFIG secret::Use the contents of ~/.config/copr."
                        exit 1
                    fi

                    if [[ -z "${COPR_PROJECT}" ]]; then
                        echo "::error title=Missing COPR_PROJECT variable::Use almighty-shogun/silent-compose."
                        exit 1
                    fi

            -   name: ⚙️ Install COPR client
                run: |
                    set -Eeuo pipefail

                    dnf -y \
                        --setopt=install_weak_deps=False \
                        --setopt=tsflags=nodocs \
                        install \
                        copr-cli

            -   name: ⚙️ Download build artifact
                uses: actions/download-artifact@v4
                with:
                    name: silent-compose-fedora-assets
                    path: release-assets

            -   name: 🚀 Submit source RPM to COPR
                run: |
                    set -Eeuo pipefail

                    SOURCE_RPM="release-assets/silent-compose-${RELEASE_TAG}-${RPM_RELEASE}.fc44.src.rpm"

                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ -f "${SOURCE_RPM}" ]]

                    mkdir -p "${HOME}/.config"
                    printf '%s\n' "${COPR_CONFIG}" > "${HOME}/.config/copr"
                    chmod 600 "${HOME}/.config/copr"

                    copr-cli build --nowait "${COPR_PROJECT}" "${SOURCE_RPM}"
