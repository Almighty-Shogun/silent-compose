name: 🚀 Release

on:
    release:
        types: [ published ]

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    build:
        name: 🚀 Build Fedora 44 release assets
        runs-on: ubuntu-latest
        container:
            image: fedora:44

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            RPM_RELEASE: "1"

        steps:
            -   name: ⚙️ Install build dependencies
                run: |
                    set -Eeuo pipefail
                    dnf -y \
                        --setopt=install_weak_deps=False \
                        --setopt=tsflags=nodocs \
                        install \
                        cpio \
                        gcc \
                        git \
                        glib2-devel \
                        gtk4-devel \
                        ibus-devel \
                        meson \
                        ninja-build \
                        pkgconf-pkg-config \
                        rpm-build \
                        tar \
                        xz

            -   name: 👀 Checkout
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.release.tag_name }}
                    fetch-depth: 0

            -   name: ⚙️ Trust checked-out workspace
                run: |
                    set -Eeuo pipefail
                    git config --global --add safe.directory "${GITHUB_WORKSPACE}"

            -   name: ⚙️ Validate release version
                run: |
                    set -Eeuo pipefail

                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ "${RPM_RELEASE}" =~ ^[0-9]+$ ]]
                    [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$(git rev-parse HEAD)" ]]

                    {
                        echo "VERSION=${RELEASE_TAG}"
                        echo "SC_VERSION=${RELEASE_TAG}"
                        echo "SOURCE_ARCHIVE=build/meson-dist/silent-compose-${RELEASE_TAG}.tar.xz"
                        echo "BINARY_ASSET=silent-compose.fc44.rpm"
                    } >> "${GITHUB_ENV}"

            -   name: 🔨 Build and test
                run: |
                    set -Eeuo pipefail

                    meson setup build --wipe
                    meson compile -C build
                    meson test -C build --print-errorlogs

                    MESON_VERSION="$(
                        meson introspect build --projectinfo |
                            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
                    )"

                    [[ "${MESON_VERSION}" == "${VERSION}" ]]
                    [[ "$(build/src/silent-compose-ibus --version)" == "Silent Compose ${VERSION}" ]]

            -   name: 🔨 Warning-as-error build and test
                run: |
                    set -Eeuo pipefail

                    meson setup build-review --wipe -Dwarning_level=3 -Dwerror=true
                    meson compile -C build-review
                    meson test -C build-review --print-errorlogs

            -   name: 🔨 Build source archive
                run: |
                    set -Eeuo pipefail

                    meson dist -C build --formats=xztar
                    [[ -f "${SOURCE_ARCHIVE}" ]]

                    if tar -tf "${SOURCE_ARCHIVE}" | grep -qx "silent-compose-${VERSION}/VERSION"; then
                        echo "VERSION file must not be packaged; release versions come from Git tags." >&2
                        exit 1
                    fi

            -   name: 🔨 Build Fedora RPMs
                run: |
                    set -Eeuo pipefail

                    RPM_TOPDIR="$(rpm --eval '%{_topdir}')"
                    [[ -n "${RPM_TOPDIR}" && "${RPM_TOPDIR}" != "%{_topdir}" ]]

                    mkdir -p \
                        "${RPM_TOPDIR}/BUILD" \
                        "${RPM_TOPDIR}/BUILDROOT" \
                        "${RPM_TOPDIR}/RPMS" \
                        "${RPM_TOPDIR}/SOURCES" \
                        "${RPM_TOPDIR}/SPECS" \
                        "${RPM_TOPDIR}/SRPMS"

                    mkdir -p build/packaging
                    sed \
                        -e "s/@VERSION@/${VERSION}/g" \
                        -e "s/@RPM_RELEASE@/${RPM_RELEASE}/g" \
                        -e "s/@RPM_CHANGELOG_DATE@/$(LC_ALL=C date -u '+%a %b %d %Y')/g" \
                        packaging/silent-compose.spec.in > build/packaging/silent-compose.spec

                    cp -- "${SOURCE_ARCHIVE}" "${RPM_TOPDIR}/SOURCES/"
                    rpmbuild -ba build/packaging/silent-compose.spec

                    mapfile -t BINARY_RPMS < <(
                        find "${RPM_TOPDIR}/RPMS" \
                            -type f \
                            -name "silent-compose-${VERSION}-${RPM_RELEASE}.fc44.*.rpm" \
                            ! -name "*debug*" \
                            -print
                    )
                    mapfile -t SOURCE_RPMS < <(
                        find "${RPM_TOPDIR}/SRPMS" \
                            -type f \
                            -name "silent-compose-${VERSION}-${RPM_RELEASE}.fc44.src.rpm" \
                            -print
                    )

                    [[ "${#BINARY_RPMS[@]}" == "1" ]]
                    [[ "${#SOURCE_RPMS[@]}" == "1" ]]

                    {
                        echo "BINARY_RPM=${BINARY_RPMS[0]}"
                        echo "SOURCE_RPM=${SOURCE_RPMS[0]}"
                    } >> "${GITHUB_ENV}"

            -   name: ⚙️ Verify release artifacts
                run: |
                    set -Eeuo pipefail

                    [[ "$(rpm -qp --qf '%{VERSION}' "${BINARY_RPM}")" == "${VERSION}" ]]
                    [[ "$(rpm -qp --qf '%{RELEASE}' "${BINARY_RPM}")" == "${RPM_RELEASE}.fc44" ]]
                    [[ "$(rpm -qp --qf '%{VERSION}' "${SOURCE_RPM}")" == "${VERSION}" ]]
                    [[ "$(rpm -qp --qf '%{RELEASE}' "${SOURCE_RPM}")" == "${RPM_RELEASE}.fc44" ]]

                    rm -rf release-assets release-inspect
                    mkdir -p \
                        release-assets \
                        release-inspect/binary-rpm \
                        release-inspect/source-rpm \
                        release-inspect/source-archive

                    rpm -qpi "${BINARY_RPM}" | tee release-assets/rpm-info.txt
                    rpm -qlp "${BINARY_RPM}" | tee release-assets/rpm-files.txt
                    rpm -qpR "${BINARY_RPM}" | tee release-assets/rpm-requires.txt
                    rpm -qpi "${SOURCE_RPM}" | tee release-assets/srpm-info.txt

                    cp -- "${BINARY_RPM}" "release-assets/${BINARY_ASSET}"
                    cp -- "${SOURCE_RPM}" release-assets/
                    cp -- "${SOURCE_ARCHIVE}" release-assets/

                    tar -xf "${SOURCE_ARCHIVE}" -C release-inspect/source-archive
                    (
                        cd release-inspect/binary-rpm
                        rpm2cpio "${BINARY_RPM}" | cpio -id --quiet
                    )
                    (
                        cd release-inspect/source-rpm
                        rpm2cpio "${SOURCE_RPM}" | cpio -id --quiet
                        tar -xf "silent-compose-${VERSION}.tar.xz"
                    )

                    HOME_PATH_PATTERN="/""home/"
                    X11_NAME="x11"
                    WRAPPER_PATTERN="run-as-${X11_NAME}"
                    OZONE_PATTERN="ozone-platform=${X11_NAME}"

                    ! grep -Rns \
                        -e "${HOME_PATH_PATTERN}" \
                        -e "${WRAPPER_PATTERN}" \
                        -e "${OZONE_PATTERN}" \
                        release-assets \
                        release-inspect

                    (
                        cd release-assets
                        sha256sum \
                            "${BINARY_ASSET}" \
                            "silent-compose-${VERSION}-${RPM_RELEASE}.fc44.src.rpm" \
                            "silent-compose-${VERSION}.tar.xz" > SHA256SUMS
                    )

            -   name: 🚀 Upload build artifact
                uses: actions/upload-artifact@v4
                with:
                    name: silent-compose-release-assets
                    path: release-assets/
                    if-no-files-found: error

    upload:
        name: 🚀 Upload GitHub release assets
        runs-on: ubuntu-latest
        needs: build

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            RPM_RELEASE: "1"
            GH_TOKEN: ${{ github.token }}

        steps:
            -   name: ⚙️ Validate release tag
                run: |
                    set -Eeuo pipefail
                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

            -   name: ⚙️ Download build artifact
                uses: actions/download-artifact@v4
                with:
                    name: silent-compose-release-assets
                    path: release-assets

            -   name: 🚀 Upload release assets
                run: |
                    set -Eeuo pipefail

                    gh release upload "${RELEASE_TAG}" \
                        release-assets/silent-compose.fc44.rpm \
                        "release-assets/silent-compose-${RELEASE_TAG}-${RPM_RELEASE}.fc44.src.rpm" \
                        "release-assets/silent-compose-${RELEASE_TAG}.tar.xz" \
                        release-assets/SHA256SUMS \
                        --repo "${GITHUB_REPOSITORY}" \
                        --clobber

    copr:
        name: 🚀 Publish COPR build
        runs-on: ubuntu-latest
        needs: [ build, upload ]
        container:
            image: fedora:44

        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            RPM_RELEASE: "1"
            COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
            COPR_PROJECT: ${{ vars.COPR_PROJECT }}

        steps:
            -   name: ⚙️ Validate COPR configuration
                run: |
                    set -Eeuo pipefail

                    if [[ -z "${COPR_CONFIG}" ]]; then
                        echo "::error title=Missing COPR_CONFIG secret::Use the contents of ~/.config/copr."
                        exit 1
                    fi

                    if [[ -z "${COPR_PROJECT}" ]]; then
                        echo "::error title=Missing COPR_PROJECT variable::Use almighty-shogun/silent-compose."
                        exit 1
                    fi

            -   name: ⚙️ Install COPR client
                run: |
                    set -Eeuo pipefail

                    dnf -y \
                        --setopt=install_weak_deps=False \
                        --setopt=tsflags=nodocs \
                        install \
                        copr-cli

            -   name: ⚙️ Download build artifact
                uses: actions/download-artifact@v4
                with:
                    name: silent-compose-release-assets
                    path: release-assets

            -   name: 🚀 Submit source RPM to COPR
                run: |
                    set -Eeuo pipefail

                    SOURCE_RPM="release-assets/silent-compose-${RELEASE_TAG}-${RPM_RELEASE}.fc44.src.rpm"

                    [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ -f "${SOURCE_RPM}" ]]

                    mkdir -p "${HOME}/.config"
                    printf '%s\n' "${COPR_CONFIG}" > "${HOME}/.config/copr"
                    chmod 600 "${HOME}/.config/copr"

                    copr-cli build "${COPR_PROJECT}" "${SOURCE_RPM}"
